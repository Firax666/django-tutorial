name: CI/CD

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build test image
        run: docker build --tag polls-test-image .
      - name: Static code analysis
        run: docker run --rm -e DJANGO_SECRET_KEY=ci-only-not-for-production polls-test-image python manage.py check
      - name: Run tests
        run: docker run --rm -e DJANGO_SECRET_KEY=ci-only-not-for-production polls-test-image python manage.py test polls --verbosity 2

  build:
    name: Build and push
    runs-on: ubuntu-latest
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build --tag polls-image .
      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          docker tag polls-image "$IMAGE"
          docker push "$IMAGE"
